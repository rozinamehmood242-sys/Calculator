<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeAlpha Calculator</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Arial, sans-serif; }
body { background:linear-gradient(135deg,#6a11cb,#2575fc); min-height:100vh; display:flex; justify-content:center; align-items:center; padding:20px; }
.calculator { background:white; width:340px; border-radius:20px; padding:25px; box-shadow:0 20px 40px rgba(0,0,0,0.3); }
.calculator h2 { text-align:center; color:#6a11cb; margin-bottom:15px; }
#display { width:100%; height:60px; font-size:28px; text-align:right; padding:10px 15px; border:2px solid #eee; border-radius:12px; margin-bottom:15px; outline:none; background:#f8f9ff; }
.buttons { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
button { height:55px; font-size:18px; font-weight:bold; border:none; border-radius:12px; cursor:pointer; background:#f0f0f0; }
button:hover { background:#e0e0ff; }
.btn-operator { background:#ff9f43; color:white; }
.btn-equal { background:#2575fc; color:white; }
.btn-clear { background:#ff4757; color:white; }
</style>
</head>
<body>
<div class="calculator">
<h2>🧮 Calculator</h2>
<input type="text" id="display" value="0" readonly>
<div class="buttons">
<button class="btn-clear" onclick="clearDisplay()">C</button>
<button onclick="deleteLast()">⌫</button>
<button class="btn-operator" onclick="appendValue('%')">%</button>
<button class="btn-operator" onclick="appendValue('/')">÷</button>
<button onclick="appendValue('7')">7</button>
<button onclick="appendValue('8')">8</button>
<button onclick="appendValue('9')">9</button>
<button class="btn-operator" onclick="appendValue('*')">×</button>
<button onclick="appendValue('4')">4</button>
<button onclick="appendValue('5')">5</button>
<button onclick="appendValue('6')">6</button>
<button class="btn-operator" onclick="appendValue('-')">-</button>
<button onclick="appendValue('1')">1</button>
<button onclick="appendValue('2')">2</button>
<button onclick="appendValue('3')">3</button>
<button class="btn-operator" onclick="appendValue('+')">+</button>
<button onclick="appendValue('0')">0</button>
<button onclick="appendValue('.')">.</button>
<button class="btn-equal" onclick="calculate()">=</button>
</div>
<p style="text-align:center; margin-top:15px; color:#888; font-size:12px;">Made by Rozina Mehmood | CodeAlpha</p>
</div>
<script>
let display = document.getElementById('display');
function appendValue(v){
  if(display.value === '0' && v !== '.'){ display.value = v; }
  else { display.value += v; }
}
function clearDisplay(){ display.value = '0'; }
function deleteLast(){
  display.value = display.value.slice(0,-1);
  if(display.value === '') display.value = '0';
}
function calculate(){
  try{ display.value = eval(display.value); }
  catch{ display.value = 'Error'; }
}
</script>
</body>
</html>
